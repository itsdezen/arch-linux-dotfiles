# The actual wallpaper path is NOT hardcoded here — it lives in a
# runtime-only, gitignored file at ~/.config/hypr/wallpaper.conf, written by
# scripts/.local/bin/wallpaper-set <path> (which also live-reloads via
# `hyprctl hyprpaper reload`). That file is never part of this repo, so it
# doesn't exist until first run — until then hyprpaper shows a blank
# background, which is an expected first-run step, not a bug.
source = ~/.config/hypr/wallpaper.conf

splash = false
ipc = on
