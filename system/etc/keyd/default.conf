# Deployed by install.sh via `sudo install -D` — never symlinked/stowed.
#
# 1. Swap the physical Alt and Super/Win keys, system-wide (every app, not
#    just Hyprland): physical Alt now emits the meta (Super) keycode and
#    physical Super now emits the alt keycode. This is a base-layer remap,
#    evaluated before keyd's modifier layers below, so "meta"/"alt" in the
#    rest of this file — and mainMod ("SUPER") / navMod ("ALT") in
#    hyprland/.config/hypr/binds.lua — mean the thumb-reachable physical
#    Alt key and the physical Win key respectively, not the printed
#    keycap. Only the left-hand keys are swapped; rightalt (AltGr, used by
#    fcitx5/Unikey compose sequences) is left untouched.
#
# 2. Makes (logical) Super act like macOS's Cmd key for terminal
#    copy/paste/clear, without losing any of Hyprland's existing
#    SUPER+<key> compositor binds (hyprland/.config/hypr/binds.lua) for
#    every other key.
#
# `meta` is keyd's implicit layer for the Super/Cmd key — any key not
# listed below still passes through as plain super+<key>, exactly as
# Hyprland already expects. Only c/v/k are remapped here, to
# ctrl+shift+c / ctrl+shift+v / ctrl+shift+k — the exact combos Ghostty
# already binds to copy / paste / clear (see
# ghostty/.config/ghostty/config). keyd remaps at the evdev level, below
# the compositor, so Hyprland never sees these three as "super+..." and
# can't swallow them the way it does every other super-prefixed combo.
# (SUPER+V and SUPER+K don't collide with Hyprland's own SUPER+V /
# SUPER+K anymore either — clipboard-picker moved to SUPER+SHIFT+V and
# focus/move-window moved to navMod "ALT" in binds.lua.)
[ids]
*

[main]
leftalt = leftmeta
leftmeta = leftalt

[meta]
c = C-S-c
v = C-S-v
k = C-S-k
