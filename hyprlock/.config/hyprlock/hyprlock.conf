# Minimal lock screen — clock, date, password field. No extra widgets.

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 3
}

general {
    no_fade_in = false
    grace = 0
    hide_cursor = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(192, 202, 245, 1.0)
    font_size = 90
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(122, 162, 247, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(59, 66, 97, 1.0)
    inner_color = rgba(31, 35, 53, 1.0)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##565f89">Password...</span>
    hide_input = false
    position = 0, -160
    halign = center
    valign = center
}
