# Restrained bezier animations — quick and subtle, not bouncy.
bezier = easeOutQuint,0.23,1,0.32,1
bezier = linear,0,0,1,1

animations {
    enabled = true

    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 3, linear, popin 87%
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = fade, 1, 3, easeOutQuint
    animation = layers, 1, 3, easeOutQuint
    animation = layersIn, 1, 3, easeOutQuint, fade
    animation = layersOut, 1, 3, linear, fade
    animation = fadeLayersIn, 1, 3, easeOutQuint
    animation = fadeLayersOut, 1, 3, linear
    animation = workspaces, 1, 3, easeOutQuint, slide
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}
